<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Photo Cleaner+</title>
  <meta name="description" content="Support and privacy information for Live Photo Cleaner+.">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #007d8f;
      --text: #172022;
      --muted: #5d6a70;
      --background: #f7fafb;
      --panel: #ffffff;
      --border: #d9e4e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #40dce8;
        --text: #eef7f8;
        --muted: #aab9be;
        --background: #0f1517;
        --panel: #161d20;
        --border: #2c383d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(840px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(24px, 5vw, 44px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
    }

    ul {
      padding-left: 1.25rem;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Live Photo Cleaner+</h1>
      <p>Support and policy information for Live Photo Cleaner+.</p>
      <ul>
        <li><a href="support.html">Support</a></li>
        <li><a href="privacy.html">Privacy Policy</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
